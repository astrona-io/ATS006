          - name: "GNU Findutils: find manual"
            url: https://www.gnu.org/software/findutils/manual/html_mono/find.html
      - type: reading
        title: "Section 020 Knowledge Check: Permissions & File Triage"
        path: sections/section-020/quiz.md
      - type: reading
        title: Question
        path: labs/lab-020/docs/question.md
      - type: lab
        title: "Permissions & File Triage Capstone Lab"
