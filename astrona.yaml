# Course manifest for ATS006 - Essential Commands (Linux Foundation
# Certified System Administrator, LFCS).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section quiz and the section capstone close the section.
# There are no playgrounds yet. solution.md files are never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS006
  title: "LFCS: Essential Commands"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Essential Commands domain, with hands-on labs for
    each competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Essential Commands
    weight: 20

modules:

  - id: module-010
    title: "Section 010: Shell Semantics: Redirection, Exit Codes & Environment"
    description: >
      Master the plumbing every other command in this course sits on top
      of: diagnosing a program's stdout/stderr/exit-code contract, and the
      difference between a shell-local variable and one exported into a
      child process's environment.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md
      - type: reading
        title: "Shell Redirection, stdout/stderr, and Exit Codes"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Three Signal Lines"
        path: sections/section-010/module-01/course-01-three-signal-lines.md
      - type: reading
        title: "Combining Both Streams In The Right Order"
        path: sections/section-010/module-01/course-02-combining-both-streams.md
      - type: reading
        title: "Reading The Exit Code"
        path: sections/section-010/module-01/course-03-reading-the-exit-code.md
      - type: reading
        title: Question
        path: labs/lab-011/docs/question.md
      - type: lab
        title: "Shell Redirection & Exit Code Diagnostics Lab"
        path: labs/lab-011
        difficulty: intermediate
        estimated_duration: 15m
        topic: redirection
        task_kind: build
        tags: [stdout, stderr, redirection, exit-codes, dev-null]
        learning_goals:
          - Send a program's stdout and stderr to separate files
          - Capture both streams in one file with the redirections in the right order
          - Record a program's exit code before another command overwrites it
        resources:
          - name: "Bash Reference Manual: Redirections"
            url: https://www.gnu.org/software/bash/manual/html_node/Redirections.html
          - name: "Bash Reference Manual: Special Parameters"
            url: https://www.gnu.org/software/bash/manual/html_node/Special-Parameters.html
      - type: reading
        title: "Wrap-Up: Mission Debrief"
        path: sections/section-010/module-01/course-04-wrap-up.md
      - type: reading
        title: "Environment Variables and Scope"
        path: sections/section-010/module-02/course.md
      - type: reading
        title: "Shell Variables And Export"
        path: sections/section-010/module-02/course-01-shell-variables-and-export.md
      - type: reading
        title: "Scope In Scripts, Braces And Quotes"
        path: sections/section-010/module-02/course-02-scope-in-scripts.md
      - type: reading
        title: Question
        path: labs/lab-012/docs/question.md
      - type: lab
        title: "Environment Variable Scope Lab"
        path: labs/lab-012
        difficulty: intermediate
        estimated_duration: 15m
        topic: environment
        task_kind: build
        tags: [environment-variables, export, shell-scripts, bashrc]
        learning_goals:
          - Write a script that keeps one variable local and exports another to its child processes
          - Build a new variable from an existing exported one without changing ~/.bashrc
        resources:
          - name: "Bash Reference Manual: Shell Parameters"
            url: https://www.gnu.org/software/bash/manual/html_node/Shell-Parameters.html
          - name: "Bash Reference Manual: Environment"
            url: https://www.gnu.org/software/bash/manual/html_node/Environment.html
          - name: "Bash Reference Manual: Bourne Shell Builtins (export, umask)"
            url: https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html
      - type: reading
        title: "Wrap-Up: Mission Debrief"
        path: sections/section-010/module-02/course-03-wrap-up.md
      - type: reading
        title: "Section 010 Knowledge Check: Shell Semantics"
        path: sections/section-010/quiz.md
      - type: reading
        title: Question
        path: labs/lab-010/docs/question.md
      - type: lab
        title: "Shell Semantics Integration Capstone Lab"
