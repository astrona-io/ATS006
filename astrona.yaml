  - id: module-020
    title: "Section 020: Permissions & File Triage"
    description: >
      Master chmod's symbolic/octal/special bits, understand why umask
      decides new-file permissions before chmod ever runs, and use find's
      permission/size/age predicates to triage files at scale.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-020/README.md
      - type: reading
        title: "chmod — Symbolic vs Octal, and the Three Special Bits"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: Question
        path: labs/lab-021/docs/question.md
      - type: lab
        title: "chmod Permission Bits Lab"
        path: labs/lab-021
        difficulty: intermediate
        estimated_duration: 15m
        topic: permissions
        task_kind: build
        tags: [chmod, octal-mode, setgid, sticky-bit, groups]
        learning_goals:
          - Lock a shared directory to its owner and group, with new files inheriting the group
          - Make a script executable by its owner only
          - Protect a shared drop folder so users can delete only their own files
        resources:
          - name: "GNU Coreutils: chmod invocation"
            url: https://www.gnu.org/software/coreutils/manual/html_node/chmod-invocation.html
          - name: "GNU Coreutils: File permissions"
            url: https://www.gnu.org/software/coreutils/manual/html_node/File-permissions.html
      - type: reading
        title: "umask — Why New Files Aren't 777 By Default"
