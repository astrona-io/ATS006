        title: "umask Default Permissions Lab"
        path: labs/lab-022
        difficulty: intermediate
        estimated_duration: 15m
        topic: permissions
        task_kind: build
        tags: [umask, octal-mode, bashrc, file-permissions]
        learning_goals:
          - Predict the mode of a new file and a new directory from the current umask
