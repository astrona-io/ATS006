  - id: module-060
    title: "Section 060: Diskspace Management & Remote Sync"
    description: >
      Diagnose a full filesystem that du can't explain — the classic
      deleted-but-open-file-handle problem — then mirror and snapshot data
      efficiently across hosts with rsync.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-060/README.md
      - type: reading
        title: "Diskspace Troubleshooting: The Full Filesystem That du Can't Explain"
        path: sections/section-060/module-01/course.md
      - type: reading
        title: Question
        path: labs/lab-061/docs/question.md
      - type: lab
        title: "Diskspace Troubleshooting Lab"
        path: labs/lab-061
        difficulty: intermediate
        estimated_duration: 20m
        topic: disk-space
        task_kind: troubleshooting
        tags: [df, du, lsof, deleted-open-files, systemctl]
        learning_goals:
          - Show that df and du disagree on the same filesystem
          - Find the process holding a deleted file open
          - Reclaim the space without deleting the application's legitimate logs
