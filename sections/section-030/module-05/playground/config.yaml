# Finding Help and Editing Files (PLAYGROUND) - Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.

metadata:
  name: "docs-editor-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "OS prep only: install the manual pages, vim and nano, and seed a file to edit. Nothing to solve."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: ""
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      display: false
      sshPasswordAuth: false
