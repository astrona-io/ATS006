metadata:
  name: "ats-006-lab-034"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-034-setup"
      description: "Creates the candidate user and a data folder with a crew table, a visit log and two settings files"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-text-reports"
      description: "Checks the five report files against the values that the data files produce"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
