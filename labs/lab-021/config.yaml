metadata:
  name: "ats-006-lab-021"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-021-setup"
      description: "Creates the analysts group/user and pre-stages the shared reports directory, backup-runner.sh script, and dropbox folder with intentionally wrong permissions"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-chmod-permission-bits"
      description: "Confirms setgid on the shared reports directory (with group inheritance), owner-only lockdown on backup-runner.sh, and the sticky bit on dropbox"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
