metadata:
  name: "ats-006-lab-043"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-043-setup"
      description: "Seeds a bare upstream repository with a single initial commit"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-upstream-reconciliation"
      description: "Confirms the topic branch was rebased cleanly onto the simulated upstream commit"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
