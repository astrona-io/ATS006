metadata:
  name: "ats-006-lab-041"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-041-setup"
      description: "Ensures the working directories exist and a throwaway git identity is configured"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-git-fundamentals"
      description: "Confirms repository init, staged/committed history, .gitignore behavior, and a working push/fetch/pull remote"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
