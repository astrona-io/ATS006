metadata:
  name: "ats-006-lab-041"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-041-setup"
      description: "Ensures the working directories exist and a throwaway git identity is configured"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-git-fundamentals"
      description: "Confirms repository init, staged/committed history, .gitignore behavior, and a working push/fetch/pull remote"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
