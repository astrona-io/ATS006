metadata:
  name: "ats-006-lab-035"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-035-setup"
      description: "Installs the manual pages, vim and nano, and creates the candidate user with a half-filled flight plan"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-flightplan-and-answers"
      description: "Checks the exact content of the edited flight plan and of the answers file"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
