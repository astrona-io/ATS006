metadata:
  name: "ats-006-lab-035"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-035-setup"
      description: "Installs the manual pages, vim and nano, and creates the candidate user with a half-filled flight plan"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-flightplan-and-answers"
      description: "Checks the exact content of the edited flight plan and of the answers file"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
