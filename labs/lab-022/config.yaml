metadata:
  name: "ats-006-lab-022"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-022-setup"
      description: "Creates the candidate user with a default system umask and no persistent umask override yet configured"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-umask-persistent"
      description: "Confirms a fresh login shell for candidate produces 640 files and 750 directories with no chmod involved"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
