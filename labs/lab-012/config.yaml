metadata:
  name: "ats-006-lab-012"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-012-setup"
      description: "Pre-stages an existing exported VARIABLE1 in the user's .bashrc"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-variable-scope-script"
      description: "Confirms script.sh defines VARIABLE2 as shell-local, exports VARIABLE3 correctly, produces the right output, and .bashrc was never touched"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
