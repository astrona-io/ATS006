metadata:
  name: "ats-006-lab-031"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-031-setup"
      description: "Seeds /var/log-collector/003/nginx.log and server.log with realistic mixed matching/decoy lines"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-grep-sed-completed"
      description: "Confirms nginx.log.extracted contains exactly the matching lines and server.log was redacted correctly"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
