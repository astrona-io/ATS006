metadata:
  name: "ats-006-lab-013"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-013-setup"
      description: "Creates the candidate user, an inbox folder with text files and an empty scripts folder"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-count-lines-script"
      description: "Runs the script with no argument, a bad argument, a normal folder, a folder with spaces in file names and an empty folder, and checks output and exit codes"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
