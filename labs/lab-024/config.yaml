metadata:
  name: "ats-006-lab-024"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-024-setup"
      description: "Creates the candidate user, the group loaders and a cargo folder with files, a scratch folder and a crates folder"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-file-operations"
      description: "Checks the new tree, the preserved copy, the moved file, the hard link, the symbolic link, the removed folder and the group ownership"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
