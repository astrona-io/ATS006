metadata:
  name: "ats-006-lab-011"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-011-setup"
      description: "Installs the fixed-output /bin/output-generator diagnostic program"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-redirection-and-exit-code"
      description: "Confirms stdout/stderr were captured independently, combined correctly, and the exit code was captured accurately"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
